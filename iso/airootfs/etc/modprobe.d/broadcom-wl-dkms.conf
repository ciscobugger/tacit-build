# Arch's broadcom-wl-dkms list (/usr/lib/modprobe.d/broadcom-wl-dkms.conf, which this file replaces) less brcmfmac:
# no chip wl drives is one brcmfmac drives, and blacklisting it left most newer Broadcom Wi-Fi without a driver
blacklist b43
blacklist b43legacy
blacklist bcm43xx
blacklist bcma
blacklist brcm80211
blacklist brcmsmac
blacklist ssb
