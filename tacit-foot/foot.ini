# Tacit's terminal for everyone (tacit-foot, /etc/xdg/foot/foot.ini): the owner's foot.ini (2026-10-16). A person's
# own ~/.config/foot/foot.ini replaces it. The colours come from the wallpaper (switchwall.sh, fish/tacit.fish).
shell=fish
term=xterm-256color

title=foot

font=Tacit Mono:size=11,JetBrainsMono Nerd Font:size=11
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

# foot 1.28 renamed [colors] to [colors-dark] / [colors-light].
#
# alpha makes foot's own surface translucent, which is what gives Hyprland a
# transparent region to render blur into. Hyprland's inactive_opacity only fades
# the finished window (text included) and produces see-through, not frost.
#
# blur asks the compositor for a background blur via ext-background-effect-v1
# (this build reports +blur). Harmless if the compositor lacks the protocol.
[colors-dark]
alpha=0.85
blur=yes

[colors-light]
alpha=0.85
blur=yes
